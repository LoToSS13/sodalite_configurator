<!DOCTYPE html>
<html lang="ru">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Конфигуратор модулей Sodalite: слои, карточки объектов и поиск.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="sodalite_configurator">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Sodalite — Конфигуратор</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="splash.css">
</head>
<body>
  <div id="startup-screen" aria-label="Загрузка конфигуратора">
    <div class="startup-backdrop" aria-hidden="true">
      <canvas id="startup-background"></canvas>
    </div>
    <main class="startup-content">
      <div class="startup-brand">
        <img src="assets/assets/images/sodalite.png" width="56" height="56" alt="">
        <div>
          <h1>Sodalite</h1>
          <p>Конфигуратор</p>
        </div>
      </div>
      <div class="startup-status" role="status" aria-live="polite">
        <span class="startup-spinner" aria-hidden="true"></span>
        <span id="startup-message">Загружаем конфигуратор…</span>
      </div>
      <button id="startup-retry" type="button" hidden>Обновить страницу</button>
      <noscript>Для работы конфигуратора включите JavaScript в браузере.</noscript>
    </main>
  </div>
  <script src="splash.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
